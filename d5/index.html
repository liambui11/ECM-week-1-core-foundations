<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="form-card">
        <header>
            <h1>Create Account</h1>
            <p>Please fill in the details below</p>
        </header>

        <form id="registration-form" novalidate>
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="John Doe">
                <small class="error-msg"></small>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="john@example.com">
                <small class="error-msg"></small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••">
                <div class="strength-meter"><div id="strength-bar"></div></div>
                <small class="error-msg"></small>
            </div>

            <div class="form-group">
                <label for="confirm">Confirm Password</label>
                <input type="password" id="confirm" name="confirm" placeholder="••••••••">
                <small class="error-msg"></small>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="0901234567">
                <small class="error-msg"></small>
            </div>

            <button type="submit" id="submit-btn" disabled>Register</button>
        </form>
    </main>
    <script src="app.js"></script>
</body>
</html>
